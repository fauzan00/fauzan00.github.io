<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Random Number Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .input-group {
            flex: 1;
            min-width: 120px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-generate {
            background: #667eea;
            color: white;
        }
        .btn-generate:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-reset {
            background: #f44336;
            color: white;
        }
        .btn-reset:hover {
            background: #da190b;
            transform: translateY(-2px);
        }
        .result {
            text-align: center;
            margin-bottom: 30px;
        }
        .number-display {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stats {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
        }
        .stats h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .frequency-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .frequency-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 5px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .frequency-item span:first-child {
            font-weight: 600;
            color: #333;
        }
        .frequency-item span:last-child {
            color: #667eea;
            font-weight: bold;
        }
        .total-count {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Random Number Generator</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="min">Minimum</label>
                <input type="number" id="min" value="1">
            </div>
            <div class="input-group">
                <label for="max">Maximum</label>
                <input type="number" id="max" value="10">
            </div>
        </div>

        <div class="buttons">
            <button class="btn-generate" onclick="generateNumber()">Generate</button>
            <button class="btn-reset" onclick="resetStats()">Reset</button>
        </div>

        <div class="result">
            <div class="number-display" id="result">-</div>
        </div>

        <div class="stats">
            <h3>Frequency Statistics</h3>
            <div class="frequency-list" id="frequency"></div>
            <div class="total-count" id="total">Total Generated: 0</div>
        </div>
    </div>

    <script>
        let frequency = {};
        let totalCount = 0;

        function generateNumber() {
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);

            if (isNaN(min) || isNaN(max)) {
                alert('Please enter valid numbers');
                return;
            }

            if (min >= max) {
                alert('Minimum must be less than maximum');
                return;
            }

            const random = Math.floor(Math.random() * (max - min + 1)) + min;
            
            document.getElementById('result').textContent = random;
            
            frequency[random] = (frequency[random] || 0) + 1;
            totalCount++;
            
            updateFrequencyDisplay();
        }

        function updateFrequencyDisplay() {
            const sorted = Object.entries(frequency)
                .sort((a, b) => b[1] - a[1]);
            
            const html = sorted.map(([num, count]) => `
                <div class="frequency-item">
                    <span>Number ${num}</span>
                    <span>${count} times</span>
                </div>
            `).join('');
            
            document.getElementById('frequency').innerHTML = html;
            document.getElementById('total').textContent = `Total Generated: ${totalCount}`;
        }

        function resetStats() {
            frequency = {};
            totalCount = 0;
            document.getElementById('result').textContent = '-';
            document.getElementById('frequency').innerHTML = '';
            document.getElementById('total').textContent = 'Total Generated: 0';
        }
    </script>
</body>
</html>
